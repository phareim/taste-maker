# Generated project — run `xcodegen generate` in this directory after editing.
# NEVER hand-edit TasteCapture.xcodeproj, and never hand-write the Info.plist
# or .entitlements files: xcodegen OVERWRITES whatever sits at a target's
# info.path/entitlements.path on every run. That's why every plist value below
# lives in a `properties:` block rather than a checked-in XML file.
name: TasteCapture
options:
  bundleIdPrefix: no.phareim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Same team as sfl, do, write and every15.
    DEVELOPMENT_TEAM: 7L482847WS
    CODE_SIGN_STYLE: Automatic
    # Both targets' Info.plists reference these rather than hardcoding a
    # version, so `xcodebuild CURRENT_PROJECT_VERSION=n` can override the build
    # number at archive time. testflight.sh does exactly that — App Store
    # Connect permanently rejects a build number it has already seen, and the
    # app and its extension must carry the SAME one or the upload is rejected.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  TasteCaptureKit:
    path: TasteCaptureKit

targets:
  TasteCapture:
    type: application
    platform: iOS
    sources:
      - TasteCapture
    dependencies:
      - package: TasteCaptureKit
      - target: TasteCaptureShare
        embed: true
    # Emits TasteCapture.xcodeproj/xcshareddata/xcschemes/TasteCapture.xcscheme.
    # Xcode Cloud can only build SHARED schemes, and the generated project is
    # committed for exactly that reason — see docs/superpowers/specs/
    # 2026-07-31-xcode-cloud-testflight-design.md.
    scheme:
      testTargets: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.phareim.tastecapture
        # NOTE: INFOPLIST_KEY_* build settings are ignored unless
        # GENERATE_INFOPLIST_FILE is YES. This target has an explicit
        # info.path, so every such key lives in `info.properties` below
        # instead — verified by inspecting the built archive.
        CODE_SIGN_ENTITLEMENTS: TasteCapture/TasteCapture.entitlements
        # Assets.xcassets is picked up from the sources dir; this names the icon
        # set inside it. Regenerate the art with `python3 ios/scripts/make-icon.py`.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. A personal capture app that is portrait-only, and
        # declaring iPad would warn that portrait-only needs full screen.
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: TasteCapture/TasteCapture.entitlements
      properties:
        com.apple.security.application-groups:
          - group.no.phareim.tastecapture
        keychain-access-groups:
          - $(AppIdentifierPrefix)no.phareim.tastecapture
    info:
      path: TasteCapture/Info.plist
      properties:
        CFBundleDisplayName: taste-maker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without this, App Store Connect gates EVERY TestFlight build behind a
        # manual export-compliance prompt. HTTPS-only traffic is exempt.
        ITSAppUsesNonExemptEncryption: false
        # A launch storyboard (even an empty generated one) is what stops iOS
        # letterboxing the app at a smaller-than-native resolution.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The extension can't show settings of its own, so it deep-links here.
        CFBundleURLTypes:
          - CFBundleURLName: no.phareim.tastecapture
            CFBundleURLSchemes:
              - tastecapture

  TasteCaptureShare:
    type: app-extension
    platform: iOS
    sources:
      - TasteCaptureShare
    dependencies:
      - package: TasteCaptureKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.phareim.tastecapture.share
        CODE_SIGN_ENTITLEMENTS: TasteCaptureShare/TasteCaptureShare.entitlements
        # Mandatory for an app extension in an archive — without it the .appex
        # is archived as a top-level product and the TestFlight upload is
        # rejected. xcodegen does not set this for you.
        SKIP_INSTALL: YES
    entitlements:
      path: TasteCaptureShare/TasteCaptureShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.no.phareim.tastecapture
        # Exactly one access group is entitled, so KeychainStore can omit
        # kSecAttrAccessGroup and let Keychain Services pick it automatically.
        keychain-access-groups:
          - $(AppIdentifierPrefix)no.phareim.tastecapture
    info:
      path: TasteCaptureShare/Info.plist
      properties:
        CFBundleDisplayName: Capture to taste
        # Must match the host app exactly, or the upload is rejected.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # One item at a time, matching the Chrome extension's
            # single-selection / single-image scope.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
            # Sits at the top level of the built .appex; that's where this key
            # expects to find it, so no explicit resources list is needed.
            NSExtensionJavaScriptPreprocessingFile: SharePreprocessor
