# Generated project — run `xcodegen generate` in this directory after editing.
# NEVER hand-edit TasteCapture.xcodeproj, and never hand-write the Info.plist
# or .entitlements files: xcodegen OVERWRITES whatever sits at a target's
# info.path/entitlements.path on every run. That's why every plist value below
# lives in a `properties:` block rather than a checked-in XML file.
name: TasteCapture
options:
  bundleIdPrefix: no.phareim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Left blank deliberately: every build before the on-device install runs
    # with CODE_SIGNING_ALLOWED=NO, so nothing here depends on a Team ID.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  TasteCaptureKit:
    path: TasteCaptureKit

targets:
  TasteCapture:
    type: application
    platform: iOS
    sources:
      - TasteCapture
    dependencies:
      - package: TasteCaptureKit
      - target: TasteCaptureShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.phareim.tastecapture
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: TasteCapture/TasteCapture.entitlements
    entitlements:
      path: TasteCapture/TasteCapture.entitlements
      properties:
        com.apple.security.application-groups:
          - group.no.phareim.tastecapture
        keychain-access-groups:
          - $(AppIdentifierPrefix)no.phareim.tastecapture
    info:
      path: TasteCapture/Info.plist
      properties:
        CFBundleDisplayName: taste-maker
        # The extension can't show settings of its own, so it deep-links here.
        CFBundleURLTypes:
          - CFBundleURLName: no.phareim.tastecapture
            CFBundleURLSchemes:
              - tastecapture

  TasteCaptureShare:
    type: app-extension
    platform: iOS
    sources:
      - TasteCaptureShare
    dependencies:
      - package: TasteCaptureKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.phareim.tastecapture.share
        CODE_SIGN_ENTITLEMENTS: TasteCaptureShare/TasteCaptureShare.entitlements
    entitlements:
      path: TasteCaptureShare/TasteCaptureShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.no.phareim.tastecapture
        # Exactly one access group is entitled, so KeychainStore can omit
        # kSecAttrAccessGroup and let Keychain Services pick it automatically.
        keychain-access-groups:
          - $(AppIdentifierPrefix)no.phareim.tastecapture
    info:
      path: TasteCaptureShare/Info.plist
      properties:
        CFBundleDisplayName: Capture to taste
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # One item at a time, matching the Chrome extension's
            # single-selection / single-image scope.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
            # Sits at the top level of the built .appex; that's where this key
            # expects to find it, so no explicit resources list is needed.
            NSExtensionJavaScriptPreprocessingFile: SharePreprocessor
